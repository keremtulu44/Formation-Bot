name: Render deploy (manuel)

# Otomatik dagitim icin Render Dashboard'da "After CI Checks Pass" secin.
# Hook yalnızca bilinçli manuel kurtarma içindir; CI'yi atlayabilir ve
# Render'in o andaki bagli branch'inin en son commit'ini deploy eder.
# Hook URL'i workflow input'u değildir: yalnızca Actions secret olarak saklayın.
on:
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Manuel deploy tetikle
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          if [ "$REF" != 'refs/heads/main' ]; then
            echo '::error::Manuel deploy yalnız main branch üzerinden çalıştırılabilir.'
            exit 1
          fi
          if [ -z "$HOOK" ]; then
            echo '::error::RENDER_DEPLOY_HOOK secret tanımlı değil; deploy tetiklenmedi.'
            exit 1
          fi
          # Yanıt gövdesi veya URL'i loglama: hook gizli bir yetkidir.
          if ! code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST --max-time 60 "$HOOK"); then
            echo '::error::Render hook ağına ulaşılamadı; deploy durumu Dashboard üzerinden doğrulanmalı.'
            exit 1
          fi
          echo "Render hook HTTP $code"
          if [ "$code" != 200 ] && [ "$code" != 201 ] && [ "$code" != 202 ]; then
            echo "::error::Deploy hook reddedildi (HTTP $code)."
            exit 1
          fi
          {
            echo '### Render manuel deploy talebi kabul edildi'
            echo 'Bu yanıt deploy tamamlandı anlamına gelmez. Render Deploys ve /health commit alanını doğrulayın.'
            echo 'Hook varsayılan olarak bağlı branchin en son commitini kullanır; CI durumunu ayrıca kontrol edin.'
          } >> "$GITHUB_STEP_SUMMARY"
