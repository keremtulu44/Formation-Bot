name: CI (Render parity)

# Neden bu iş akışı: Render build'i "pip install -r requirements.txt" ile
# Python 3.12'de çalışır. Burada aynı sürümle kurulum + testler + gerçek bir
# "PORT ver, /health bekle" duman testi koşar; deploy'dan ÖNCE kırılırsa burada
# kırmızı olur. Render'ın en pahalı hatası (cp314 tekerleği olmadığı için
# pandas'ın kaynak koddan derlenip patlaması) tam olarak bu adımda yakalanır.

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Python sürümü repodaki .python-version (3.12) dosyasından okunur - yani
      # Render'ın gördüğü dosyanın AYNISI. Sürüm değişirse CI de onu izler.
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Python sürümü (Render ile aynı olmalı)
        run: |
          python -V
          echo "--- .python-version ---"
          cat .python-version

      - name: Bağımlılıklar (Render Build Command'in aynısı)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kurulu sürümler
        run: pip show pandas numpy yfinance | grep -E "^(Name|Version)"

      # Statik kapı: yalnız "sessiz kırılma" sınıfları (F/E9/S110) — kural seti
      # ve gerekçesi ruff.toml'da; yerelde `ruff check .` aynı sonucu verir.
      # 2026-10-26 denetimi: bu kapı tanımsız ad (F821), kullan-önce-ata AST
      # korumasıyla (pytest'te) ve S110 yutma sınıfıyla birlikte çalışır.
      - name: Statik kapı (ruff)
        run: |
          python -m pip install -r requirements-dev.txt
          ruff check .

      - name: Unit testler (pytest)
        run: python -m pytest -q
        env:
          DATA_DIR: ${{ runner.temp }}/formation-bot-unit-data
          LOG_DIR: ${{ runner.temp }}/formation-bot-unit-logs
          LOCAL_LOG_DIR: ${{ runner.temp }}/formation-bot-unit-logs-fallback
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_CHANNEL_ID: ""
          TELEGRAM_TEST_KEY: ""
          TELEGRAM_WEBHOOK_SECRET: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""

      - name: Zamanlama / ölü formasyon regresyonu
        run: python test_tarama_zamani.py
        env:
          DATA_DIR: ${{ runner.temp }}/formation-bot-timing-data
          LOG_DIR: ${{ runner.temp }}/formation-bot-timing-logs
          LOCAL_LOG_DIR: ${{ runner.temp }}/formation-bot-timing-logs-fallback
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_CHANNEL_ID: ""
          TELEGRAM_TEST_KEY: ""
          TELEGRAM_WEBHOOK_SECRET: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""

      # Bağımsız regresyon scriptleri: pytest toplaması bunları bilinçli atlar
      # (bkz. pytest.ini); motor sözleşmelerini kendi başlarına doğrularlar.
      # 2026-10-26'ya kadar CI'da HİÇ koşmuyorlardı ve ❌ basıp exit 0 ile
      # çıkıyorlardı (CI'ı kör ederdi); artık başarısız kontrol non-zero
      # çıkışla bu adımı kırmızı yapar (bkz. denetim §4.1).
      - name: Formasyon regresyon scriptleri (bağımsız)
        run: |
          python test_triangle.py
          python test_breakout.py
          python test_flag.py
          python test_pennant.py
        env:
          DATA_DIR: ${{ runner.temp }}/formation-bot-regresyon-data
          LOG_DIR: ${{ runner.temp }}/formation-bot-regresyon-logs
          LOCAL_LOG_DIR: ${{ runner.temp }}/formation-bot-regresyon-logs-fallback
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          TELEGRAM_CHANNEL_ID: ""
          TELEGRAM_TEST_KEY: ""
          TELEGRAM_WEBHOOK_SECRET: ""
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""

      # Entry point + gerçek HTTP liveness yüzeyi denenir. BOT_HEALTH_SMOKE_ONLY
      # ana tarama döngüsünü kapatır; böylece CI Yahoo/Telegram/Supabase'e çıkmaz.
      # /test ve kapalı webhook sözleşmeleri gerçek entrypoint üzerinden doğrulanır.
      - name: Render duman testi (/health ayakta mı?)
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/formation-bot-health-smoke"
          mkdir -p "$ROOT"
          # Render'ın deploy sırasında enjekte ettiği değişkenler (sürüm görünürlüğü)
          export RENDER_GIT_COMMIT=deadbeefcafe
          export RENDER_GIT_BRANCH=main
          export BOT_HEALTH_SMOKE_ONLY=1
          export DATA_DIR="$RUNNER_TEMP/formation-bot-health-smoke/data"
          export LOG_DIR="$RUNNER_TEMP/formation-bot-health-smoke/logs"
          export LOCAL_LOG_DIR="$RUNNER_TEMP/formation-bot-health-smoke/logs-fallback"
          export TELEGRAM_BOT_TOKEN=
          export TELEGRAM_CHAT_ID=
          export TELEGRAM_CHANNEL_ID=
          export TELEGRAM_TEST_KEY=
          export TELEGRAM_WEBHOOK_SECRET=
          PORT=10000 python main.py > "$ROOT/bot.log" 2>&1 &
          BOT_PID=$!
          cleanup() {
            kill "$BOT_PID" 2>/dev/null || true
            wait "$BOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          up=0
          for i in $(seq 1 30); do
            if curl -fsS -m 5 -o "$ROOT/health.json" http://127.0.0.1:10000/health; then
              up=1
              break
            fi
            sleep 2
          done

          echo "--- /health ---"
          cat "$ROOT/health.json" 2>/dev/null || true
          echo

          if [ "$up" != "1" ]; then
            echo "::error title=/health açılmadı::PORT verildiği halde 60 sn içinde /health yanıt vermedi."
            tail -40 "$ROOT/bot.log"
            exit 1
          fi

          grep -q '"status": "ok"' "$ROOT/health.json" \
            || { echo "::error::/health gövdesi beklenen JSON değil"; exit 1; }

          # Smoke modunda ana döngü özellikle başlamaz: readiness yanlışlıkla
          # 200 dönerse liveness ve başlangıç hazırlığı birbirine karıştırılmıştır.
          ready_code=$(curl -sS -m 5 -o "$ROOT/ready.json" -w "%{http_code}" "http://127.0.0.1:10000/ready")
          if [ "$ready_code" != "503" ]; then
            echo "::error::Smoke modunda /ready 503 dönmeli; gelen HTTP $ready_code"
            exit 1
          fi
          python -c 'import json, sys; d=json.load(open(sys.argv[1])); assert d.get("startup_complete") is False' "$ROOT/ready.json"

          # Keep-alive iş akışı önbellek kırıcı parametre ekler (/health?ka=...).
          # Sorgu dizesi 404'e yol açarsa ping "servis ölü" sanılır - burada kilitliyoruz.
          kod_q=$(curl -s -o "$ROOT/health_q.json" -w "%{http_code}" "http://127.0.0.1:10000/health?ka=1")
          echo "--- /health?ka=1 -> HTTP $kod_q ---"
          if [ "$kod_q" != "200" ]; then
            echo "::error title=Sorgu dizesi /health'i bozuyor::/health?ka=1 HTTP $kod_q döndü; sorgu dizesi (ve sondaki slash) yok sayılmalı."
            exit 1
          fi
          grep -q '"commit": "deadbee"' "$ROOT/health_q.json" \
            || { echo "::error::/health canlı sürüm (RENDER_GIT_COMMIT) bilgisini döndürmeli"; exit 1; }
          echo "✅ /health sorgu dizesiyle 200 ve sürüm bilgisi (commit) içeriyor"

          code=$(curl -s -o "$ROOT/test.json" -w "%{http_code}" \
                 "http://127.0.0.1:10000/test?k=yanlis-anahtar" || echo "000")
          echo "--- /test (TELEGRAM_TEST_KEY tanımsız) -> HTTP $code ---"
          cat "$ROOT/test.json"; echo
          if [ "$code" != "404" ]; then
            echo "::error title=/test kapalı değil::TELEGRAM_TEST_KEY tanımsızken /test 404 dönmeli (Telegram'a istek gitmemeli). Dönen kod: $code"
            exit 1
          fi

          # Webhook ucu da secret tanımsızken KAPALI olmalı: kurulu olmayan uç
          # kendini belli etmez (aynı /test kuralı). Webhook'un uçtan uca akışı
          # (secret doğrulama + JSON parse + komut cevabı) pytest'te koşar:
          # test_telegram_webhook.py
          code=$(curl -s -o "$ROOT/webhook.json" -w "%{http_code}" -X POST \
                 -H "Content-Type: application/json" -d '{"update_id":1}' \
                 "http://127.0.0.1:10000/webhook/deneme" || echo "000")
          echo "--- /webhook/deneme (TELEGRAM_WEBHOOK_SECRET tanımsız) -> HTTP $code ---"
          cat "$ROOT/webhook.json"; echo
          if [ "$code" != "404" ]; then
            echo "::error title=Webhook ucu kapalı değil::TELEGRAM_WEBHOOK_SECRET tanımsızken POST /webhook/<secret> 404 dönmeli. Dönen kod: $code"
            exit 1
          fi
          echo "✅ webhook ucu secret tanımsızken 404 (kapalı)"

          grep -Fq 'Health smoke mode: provider and command loops disabled' "$ROOT/bot.log" \
            || { echo "::error::health-smoke-only guard çalışmadı"; tail -40 "$ROOT/bot.log"; exit 1; }
          if grep -Eq 'TARAMA BAŞLIYOR|Yahoo pacing:|1H fetch penceresi' "$ROOT/bot.log"; then
            echo "::error::health smoke tarama/fetch akışına girdi"; tail -40 "$ROOT/bot.log"; exit 1
          fi
          echo "✅ Health smoke yalnız HTTP liveness çalıştırdı; tarama/Yahoo fetch izi yok"

          echo "--- bot logu (ilk 25 satır) ---"
          head -25 "$ROOT/bot.log"
          echo "OK: start command ayakta ve /health 200 döndü"
