# BIST Bot logrotate config
# /etc/logrotate.d/bist-bot olarak kopyala
#
# K2 FIX: copytruncate kullanıyoruz.
# Neden? Python'un FileHandler dosyayı açar ve fd'sini tutar. `create` ile rotate
# edilirse (bot.log -> bot.log.1 + yeni bot.log) Python ESKİ dosyaya yazmaya devam
# eder -> yeni bot.log boş kalır, 7 gün sonra loglar hiç olmaz.
# `systemctl reload` de çözüm değil: service'te ExecReload tanımlı değil.
# copytruncate: dosyayı kopyalar, sonra aynı fd üzerinde truncate eder -> kayıp yok.

/var/log/bist-bot/bot.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
