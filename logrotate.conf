# BIST Bot logrotate config
# /etc/logrotate.d/bist-bot olarak kopyala

/var/log/bist-bot/bot.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 644 ubuntu ubuntu
    postrotate
        systemctl reload bist-bot > /dev/null 2>&1 || true
    endscript
}
