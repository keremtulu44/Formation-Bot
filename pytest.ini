[pytest]
# Bu 7 dosya "test_*.py" ADLI ama BAĞIMSIZ SCRIPT'tir (pytest testi DEĞİL).
# pytest varsayılan olarak test_*.py'i toplar; bu dosyalar içe aktarılınca
# modül-seviyesi kodları çalışır ve test_tarama_zamani.py satır 440'daki
# sys.exit(1) TÜM pytest toplamasını INTERNALERROR ile çökertir (CI her
# push'ta kırmızı, hiçbir birim testi koşmaz). CI onları zaten ayrıca
# `python test_tarama_zamani.py` (ve benzeri) şeklinde script olarak koşar.
# Bu yüzden pytest'in toplamasından çıkarılıyorlar.
addopts =
    --ignore=test_tarama_zamani.py
    --ignore=test_accuracy.py
    --ignore=test_breakout.py
    --ignore=test_flag.py
    --ignore=test_forward.py
    --ignore=test_pennant.py
    --ignore=test_triangle.py
