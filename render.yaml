# OPSIYONEL Render Blueprint.
#
# DİKKAT: Bu dosya yalnızca servisi Blueprint ile oluşturmak istersen kullanılır.
# Dashboard'dan zaten bir Web Service oluşturduysan BURAYA UYGULAMA, yoksa
# aynı servisin ikinci kopyası (double billing / iki bot aynı Telegram'a mesaj)
# oluşur. Mevcut serviyi yönetmek için Render Dashboard > Settings'i kullan.
#
# Python sürümü burada değil, repodaki `.python-version` dosyasında sabitlendi
# (3.12). Gerekçe: Render 2026-02-11 sonrası oluşturulan servislerde varsayılan
# Python 3.14'tür ve pandas 2.2.2 / numpy 1.26.4'ün cp314 tekerleği yoktur;
# pip kaynak koddan derlemeye düşüp build'i patlatıyor. `.python-version`
# Render dokümanında desteklenen yöntemdir ve dashboard ayarından önceliklidir.

services:
  - type: web
    name: formation-bot
    runtime: python
    plan: free
    region: frankfurt
    # CANLI pinler + güvenli build araçları; requirements.txt tarihsel replay içindir.
    buildCommand: bash scripts/install_deploy_dependencies.sh
    startCommand: python main.py
    healthCheckPath: /health
    # Yalnizca Blueprint ile yonetilen servise uygulanir; mevcut Dashboard ayarini kontrol edin.
    autoDeployTrigger: checksPass
    envVars:
      # Telegram — @BotFather'dan alınan token, Secret olarak işaretlenir
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Kendi Telegram user id'n (ör. @userinfobot). DM özetleri/alarmları için.
      - key: TELEGRAM_CHAT_ID
        sync: false
      # PUBLIC HEDEF (kanal ÖNERİLİR): @kanal_adi ya da -100… kimliği.
      # Bot bu hedefte YÖNETİCİ olmalı (en az "Mesaj gönderme"; sabit karşılama
      # için "Mesajları sabitle", açıklamayı bot yazsın istersen "Bilgiyi değiştir").
      # DM (TELEGRAM_CHAT_ID) boş olsa bile bu hedef çalışır.
      # Kurulum: KANAL_ACILIS_PAKETI.md · kontrol: python kanal_acilis.py --durum
      - key: TELEGRAM_GROUP_ID
        sync: false
      # --- PUBLIC GRUP KOMUTLARI (2026-10-28) ---
      # Grup YÖNETİCİLERİ okuma komutlarını çalıştırabilir (getChatMember ile
      # doğrulanır; API yanıt vermezse yetki verilmez). DM davranışı değişmez.
      # Bot gruba EKLENMİŞ ve en az bir kez mesaj atabilir olmalıdır.
      - key: PUBLIC_COMMANDS_ENABLED
        value: "1"
      # Boş = TELEGRAM_GROUP_ID kullanılır. Virgülle çok sohbet.
      - key: PUBLIC_COMMAND_CHATS
        sync: false
      # Varsayılan kapalı komutları aç (örn. "tara"). Boş = yalnız okuma listesi.
      - key: PUBLIC_COMMAND_EXTRA
        sync: false
      - key: PUBLIC_COMMAND_ADMIN_CACHE_SN
        value: "300"
      # Supabase — yalnız geçmişi okur; bot bu modda yeni veri yazmaz.
      # Render geçici diskindeki yeni durum yeniden deploy sırasında kaybolabilir.
      - key: SUPABASE_URL
        sync: false
      # Yeni "sb_secret_..." anahtarı veya eski service_role JWT; ikisi de olur
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BOT_PROFILE
        value: Dengeli
      # Sunucu saat dilimi = BIST saati. Verilmezse Render süreçleri UTC çalışır ve
      # Telegram günlük kotası gece 03:00'te (İstanbul) sıfırlanırdı. Kod artık
      # sayılarda İstanbul'u sabitliyor; bu değişken log damgalarını da hizalar.
      - key: TZ
        value: Europe/Istanbul
      # A7: public uçlarda IP başına istek limiti (0 = kapalı)
      - key: HEALTH_RATE_LIMIT_PER_MIN
        value: "60"
      # Render Web Service'te Telegram komutları için varsayılan webhook.
      # Uygulama, secret boşsa PORT + RENDER_EXTERNAL_URL + bot token ile
      # token'dan HMAC ile sabit secret türetir; Telegram POST'u uyuyan servisi uyandırabilir.
      # Yeni örnekler aynı başlığı doğrular; bu çoklu örnek lider kilidi değildir.
      # Yerel/systemd polling davranışı değişmez. Polling'e zorlamak için 0 yapın
      # (sabit TELEGRAM_WEBHOOK_SECRET de boş olmalı).
      - key: TELEGRAM_WEBHOOK_AUTO
        value: "1"
      # Opsiyonel sabit secret. Doluysa auto ayarından bağımsız olarak webhook kullanılır.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # --- Batch 7 (C1/C4): pazar/evren/veri dizini (hepsi OPSİYONEL) ---
      # MARKET_SUFFIX: BIST için varsayılan .IS; BIST dışı pazar için değiştirin.
      # STOCK_UNIVERSE: virgülle ayrılmış semboller; BOŞ = BIST 50.
      # DATA_DIR: Render'da varsayılan /tmp/formation-bot-data geçicidir.
      #           Supabase yalnız okunur; kalıcı disk bağlarsanız buradan verin.
      # SEED_DATA_DIR: yalnız okuma yedeği (varsayılan ./bot_data).
      # LOG_DIR: /var/log yazılamazsa otomatik ./logs'a düşer.
      - key: MARKET_SUFFIX
        value: ".IS"
      - key: STOCK_UNIVERSE
        sync: false
      # MAKRO_ALARM: ons altın/ons gümüş/USDTRY/BRENT alarm üretsin mi?
      # Varsayılan 0 (yalnız veri + grafik). Bu sembollerin seans kapanışı BIST'e
      # göre olmadığı için "yalnız kapanmış mum" kuralı gün sonu barlarında tam
      # doğrulanamaz; 1 yaparsanız BRENT eski davranışına döner.
      - key: MAKRO_ALARM
        value: "0"
      # C3: `bot_store` tablosunu paylaşan ikinci örnek anahtar çakışmasın diye.
      - key: SUPABASE_STORE_PREFIX
        value: "formation-bot:"
      # --- ALARM KARELERİ (grafik; ops.) ---
      # `yok` yalnız otomatik alarm karelerini kapatır; `/grafik` bağımsızdır.
      # `alarm` uygun DM ve public olayları için kare hazırlayabilir. Özetler,
      # eksik kaynaklar, hedef izinleri ve medya hataları teslimi etkiler.
      # Boş/0/false/off/kapalı da kapatır; belirsizlik için yok/alarm kullanın.
      - key: TELEGRAM_GRAFIK
        value: "yok"
      # DM için üst sınır 1-4; public normal olayda en fazla 2, geçersizleşmede 1.
      - key: TELEGRAM_GRAFIK_ADET
        value: "4"
      # Kadraj tavanı (mum) ve kareye çizilen onaylı BOS/CHoCH sayısı.
      - key: GRAFIK_MUM_MAKS
        value: "180"
      - key: GRAFIK_OLAY_MAKS
        value: "6"
      # --- GECE MUM TEMİZLİĞİ VE STABİL 4S SİNYALLERİ ---
      # Her gece 02:00 TSİ'de aktif evrenin 1H/1D mumlarını Supabase'e yazmadan
      # yerel bellek/disk üzerinde temiz olarak yeniler.
      - key: NIGHTLY_CANDLE_REFRESH_HOUR
        value: "2"
      - key: NIGHTLY_CANDLE_REFRESH_MINUTE
        value: "0"
      # Ayrı 4S Stabil güçlü geri alım alarmları (DM + public kanal; >3 ise 2 kart + 1 özet)
      - key: STABIL_GERI_ALIM_ALARM
        value: "1"
      - key: STABIL_ALARM_DM
        value: "1"
      - key: STABIL_ALARM_PUBLIC
        value: "1"
      - key: STABIL_ALARM_COOLDOWN_BAR
        value: "6"
      - key: STABIL_ALARM_TEKIL_UST_SINIR
        value: "3"
      - key: STABIL_ALARM_TAZE_DK
        value: "390"
